plugins {
    id "org.jetbrains.kotlin.multiplatform"
    id "org.jetbrains.kotlin.plugin.serialization"
    id "com.android.kotlin.multiplatform.library"
}

apply from: "$mppJvmJsWasmJsAndroidLinuxMingwLinuxArm64Project"

kotlin {
    js {
        browser {
            testTask {
                useKarma {
                    useChromeHeadlessNoSandbox()
                    useConfigDirectory(rootProject.relativeProjectPath("gradle/karma.config.d"))
                }
            }
        }
        nodejs {
            testTask {
                filter.excludeTestsMatching("dev.inmo.micro_utils.common.MutationObserverBrowserTests*")
            }
        }
    }

    sourceSets {
        commonMain {
            dependencies {
                api libs.klock
            }
        }
        jvmAndAndroidMain {
            dependencies {
                api project(":micro_utils.coroutines")
            }
        }
        androidMain {
            dependencies {
                api libs.android.fragment
            }
        }

        nativeMain {
            dependencies {
                api libs.okio
            }
        }

        wasmJsMain {
            dependencies {
                api libs.kotlinx.browser
                api libs.kt.coroutines
            }
        }
    }
}
